services:
  db:
    image: postgres:16
    container_name: mfp-prod-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - prod_db_data:/var/lib/postgresql/data

  server:
    image: ghcr.io/rayanbak/mfp-server:latest
    container_name: mfp-prod-server
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: supersecret
      DB_NAME: postgres
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: on-failure

  client:
    image: ghcr.io/rayanbak/mfp-client:latest
    container_name: mfp-prod-client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  prod_db_data: