name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-server:
    name: Run server tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install server dependencies
        working-directory: ./server
        run: yarn install

      - name: Run tests
        working-directory: ./server
        run: yarn test

  build-docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test-server

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t mfp-server:latest ./server

      - name: Build client image
        run: docker build -t mfp-client:latest ./client