name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  test-server:
    name: Run server tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install server dependencies
        working-directory: ./server
        run: yarn install

      - name: Run tests
        working-directory: ./server
        run: yarn test

  build-and-push-docker-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: test-server

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        run: docker build -t ghcr.io/rayanbak/mfp-server:latest ./server

      - name: Build client image
        run: docker build -t ghcr.io/rayanbak/mfp-client:latest ./client

      - name: Push server image
        if: github.event_name == 'push'
        run: docker push ghcr.io/rayanbak/mfp-server:latest

      - name: Push client image
        if: github.event_name == 'push'
        run: docker push ghcr.io/rayanbak/mfp-client:latest